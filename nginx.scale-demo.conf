worker_processes auto;
worker_rlimit_nofile 65536;

events {
  worker_connections 16384;
  multi_accept on;
}

http {
  upstream roomlock_api {
    # Default passive health check (max_fails=1 fail_timeout=10s) marks a
    # replica "down" after a single failed request — under real load one
    # transient blip on each replica in quick succession briefly took all
    # three out of rotation at once ("no live upstreams", a real failure
    # mode found running this load test, not a hypothetical one).
    # Tolerating a few failures before pulling a replica out avoids that
    # cascade while still eventually routing around one that's truly down.
    server api1:8000 max_fails=5 fail_timeout=3s;
    server api2:8000 max_fails=5 fail_timeout=3s;
    server api3:8000 max_fails=5 fail_timeout=3s;
    keepalive 64;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://roomlock_api;
      # Without these two lines nginx defaults to HTTP/1.0 with no
      # keepalive to the upstream — a brand new TCP connection per
      # request instead of a reused pool. Under real concurrency that
      # connection-setup churn is what actually falls over first, not
      # the app or the database.
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
