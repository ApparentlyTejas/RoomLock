name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: mypy
        run: mypy app

  test:
    runs-on: ubuntu-latest

    # Matches docker-compose.yml's db and redis services (same images). The
    # test suite talks to both directly over localhost, so no network alias
    # or compose stack is needed — just the service containers below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_dev_password
          POSTGRES_DB: bookingapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d bookingapi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tests/conftest.py derives the throwaway bookingapi_test database from
      # this by swapping the db name, then creates/migrates/drops it itself
      # (session-scoped autouse fixture, applying db/*.sql) — the workflow
      # doesn't need to run migrations separately.
      DATABASE_URL: postgresql+psycopg2://app:app_dev_password@localhost:5432/bookingapi
      JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-real
      TOKEN_ENCRYPTION_KEY: vaMESSBIZz7GIvBeB2ga2Qtz1bD5GXG4Hiq_oJPzCIk=
      # Overrides config.py's default "redis:6379" compose hostname, which
      # doesn't resolve on the bare runner — the service container above is
      # reachable over localhost instead, same as postgres above.
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
