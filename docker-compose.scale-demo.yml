# Standalone stack proving the concurrency guarantee holds across multiple
# app instances, not just within one process. Not part of normal dev —
# run it separately (it uses its own ports/volume so it can coexist with
# `docker compose up` if needed, though stopping that first is simpler):
#
#   docker compose -f docker-compose.scale-demo.yml up --build -d
#   for f in db/*.sql; do
#     docker compose -f docker-compose.scale-demo.yml exec db \
#       psql -U app -d bookingapi -f "/db/$(basename "$f")"
#   done
#
# Then hit http://localhost:8001 instead of :8000. Each response carries
# an X-Replica-Id header (api1/api2/api3) so you can see requests actually
# landing on different containers, not just trust that they do.
#
# Why this proves anything: correctness here comes entirely from Postgres
# (the bookings_no_overlap EXCLUDE constraint), not from any in-process
# state in the API layer. Three separate app containers, three separate
# Python processes, zero shared memory between them, hitting one Postgres
# instance — if the no-double-booking guarantee held only "by accident"
# because everything ran in one process, it would break the moment a
# second replica raced the first. It doesn't.
# Connection budget math (this is the kind of thing that silently breaks
# a "horizontally scaled" demo if left at defaults): 3 replicas x 3 worker
# processes each = 9 Python processes, each with its own connection pool
# (db_pool_size=5 + db_max_overflow=5 = 10 max). Worst case 9 x 10 = 90
# connections, under the max_connections=200 set on the db service below
# (bumped up from Postgres's own default of 100, since this is a
# disposable local demo database with no other consumers to budget for).
x-api-service: &api_service
  build: .
  restart: unless-stopped
  env_file:
    - .env
  environment:
    - DATABASE_URL=postgresql+psycopg2://app:app_dev_password@db:5432/bookingapi
    - WEB_CONCURRENCY=3
    - DB_POOL_SIZE=5
    - DB_MAX_OVERFLOW=5
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - db_data_scale_demo:/var/lib/postgresql/data
      - ./db:/db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api1:
    <<: *api_service
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app_dev_password@db:5432/bookingapi
      - WEB_CONCURRENCY=3
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=5
      - REPLICA_ID=api1

  api2:
    <<: *api_service
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app_dev_password@db:5432/bookingapi
      - WEB_CONCURRENCY=3
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=5
      - REPLICA_ID=api2

  api3:
    <<: *api_service
    environment:
      - DATABASE_URL=postgresql+psycopg2://app:app_dev_password@db:5432/bookingapi
      - WEB_CONCURRENCY=3
      - DB_POOL_SIZE=5
      - DB_MAX_OVERFLOW=5
      - REPLICA_ID=api3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.scale-demo.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8001:80"
    depends_on:
      - api1
      - api2
      - api3

volumes:
  db_data_scale_demo:
